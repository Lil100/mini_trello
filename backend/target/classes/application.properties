server.port=8080

# Database (MariaDB)
#spring.datasource.url=jdbc:mariadb://localhost:3306/mini_trello?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.url=jdbc:h2:mem:trello
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# JWT
# NOTE: Change this in production (or set MINITRELLO_JWT_SECRET env var).
minitrello.jwt.secret=${MINITRELLO_JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me-in-prod}
minitrello.jwt.expiration-minutes=120
